// ST. BRIELLE standalone development overrides.
// autoexec.cfg runs after the engine's generated settings/graphics configs,
// so these values cannot be replaced by stale Skin Deep debug settings.

set r_clear "2"
set r_lockSurfaces "0"
set r_singleArea "0"
set r_showOverDraw "0"
set r_showImages "0"
set r_skipRender "0"
set r_showTris "0"

set g_skipViewEffects "1"
set g_doubleVision "0"
set com_showFPS "0"
set con_noPrint "1"
